name: Build and Test Pure Python Wheels

on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheel:
    name: Build pure Python wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      
      - name: Build wheel
        run: python -m build --wheel
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 5

  test_wheel:
    name: Test on ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: build_wheel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', 'graalpy-24.1', 'graalpy-25.0']
    
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Download wheel artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: wheel
          path: dist
      
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
      
      - name: Test import
        run: python -c "import onlinezip; print('✓ onlinezip imported successfully')"
      
      - name: Test OnlineZip import
        run: python -c "from onlinezip.OnlineZip import OnlineZip; print('✓ OnlineZip class imported successfully')"

  upload_pypi:
    name: Publish to PyPI
    needs: test_wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # Required for trusted publishing
    
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: wheel
          path: dist
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
