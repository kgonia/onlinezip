[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Build wheels for CPython 3.9-3.13, PyPy 3.9-3.10, and specific GraalPy versions
# GraalPy version identifiers: gp311_242 = GraalPy 3.11 v24.2, gp312_250 = GraalPy 3.12 v25.0
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "pp39-*", "pp310-*", "gp311_242-*", "gp312_250-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*"]
enable = ["graalpy", "pypy"]
test-command = "python -c \"from onlinezip.OnlineZip import OnlineZip; print('onlinezip imported successfully')\""
