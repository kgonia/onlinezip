[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "pp39-*", "pp310-*", "gp311_242-*", "gp312_250-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*"]
enable = ["graalpy"]
test-command = "python -c \"import onlinezip; print('✓ onlinezip imported successfully')\""
